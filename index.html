
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fundamentals of Cyber Forensics | FCF</title>

<style>

/* GLOBAL RESET */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

/* BACKGROUND */

body {
    font-family: Georgia, Cambria, "Times New Roman", serif;
    color: #F8F1E8;

    background-color: #21151D;

    background-image:
        linear-gradient(
            rgba(198, 149, 103, 0.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(198, 149, 103, 0.045) 1px,
            transparent 1px
        ),
        radial-gradient(
            ellipse at 25% 20%,
            #482737 0%,
            #2E1B29 45%,
            #21151D 100%
        );

    background-size:
        58px 58px,
        58px 58px,
        cover;

    min-height: 100vh;
    min-height: 100dvh;

    padding: 65px 20px 35px;
}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 740px;
    margin: 0 auto;
}

/* SUBJECT HEADING */

.header {
    text-align: center;
    margin-bottom: 45px;
}

.header h1 {
    font-size: 43px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.4px;

    color: #E8BE91;
}

/* GOLD DIVIDER */

.title-divider {
    width: 100px;
    height: 2px;

    margin: 24px auto 0;

    background: linear-gradient(
        90deg,
        transparent,
        #D9A66D,
        transparent
    );
}

/* UNIT CARDS */

.units {
    display: flex;
    flex-direction: column;
    gap: 17px;
}

.unit-card {
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    min-height: 145px;
    padding: 27px 22px;

    background: linear-gradient(
        135deg,
        rgba(91, 49, 65, 0.96),
        rgba(53, 29, 43, 0.98)
    );

    border: 1px solid rgba(220, 168, 116, 0.14);
    border-radius: 14px;

    text-align: center;
    text-decoration: none;
    color: inherit;

    overflow: hidden;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.12);

    transition:
        transform 0.2s ease,
        border-color 0.2s ease;
}

/* GOLD ACCENT */

.unit-card::before {
    content: "";

    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;

    width: 5px;

    background: linear-gradient(
        to bottom,
        #E8BE91,
        #B77B4E
    );
}

/* HOVER */

.unit-card:hover {
    transform: translateY(-2px);
    border-color: rgba(232, 190, 145, 0.45);
}

.unit-card:focus-visible {
    outline: 2px solid #E8BE91;
    outline-offset: 4px;
}

/* UNIT NUMBER */

.unit-number {
    display: block;

    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;

    color: #D9A66D;
    margin-bottom: 15px;
}

/* UNIT TITLE */

.unit-title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;

    color: #FFF8F1;
    max-width: 600px;
}

/* TABLET */

@media (max-width: 768px) {

    body {
        padding-top: 55px;
    }

    .header h1 {
        font-size: 39px;
    }

    .unit-title {
        font-size: 20px;
    }
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        padding: 55px 18px 30px;
    }

    .header {
        margin-bottom: 40px;
    }

    .header h1 {
        font-size: 36px;
        line-height: 1.2;
    }

    .title-divider {
        width: 90px;
        margin-top: 22px;
    }

    .units {
        gap: 14px;
    }

    .unit-card {
        min-height: 125px;
        padding: 23px 18px;
        border-radius: 13px;
    }

    .unit-number {
        font-size: 11px;
        letter-spacing: 1.7px;
        margin-bottom: 12px;
    }

    .unit-title {
        font-size: 18px;
        line-height: 1.35;
    }
}

/* SMALL PHONES */

@media (max-width: 380px) {

    body {
        padding: 45px 14px 25px;
    }

    .header h1 {
        font-size: 32px;
    }

    .unit-card {
        min-height: 115px;
        padding: 20px 14px;
    }

    .unit-title {
        font-size: 17px;
    }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {

    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

</style>

</head>

<body>

<main class="container">

    <!-- SUBJECT TITLE -->

    <header class="header">

        <h1>
            Fundamentals of<br>
            Cyber Forensics
        </h1>

        <div class="title-divider"
             aria-hidden="true"></div>

    </header>

    <!-- UNIT NAVIGATION -->

    <nav class="units" aria-label="Course Units">

        <!-- UNIT I -->

        <a href="unit1/index.html" class="unit-card">

            <span class="unit-number">
                UNIT I
            </span>

            <div class="unit-title">
                Introduction to Computer Forensics
            </div>

        </a>

        <!-- UNIT II -->

        <a href="unit2/index.html" class="unit-card">

            <span class="unit-number">
                UNIT II
            </span>

            <div class="unit-title">
                Computer Forensic Analysis and Information Warfare
            </div>

        </a>

        <!-- UNIT III -->

        <a href="unit3/index.html" class="unit-card">

            <span class="unit-number">
                UNIT III
            </span>

            <div class="unit-title">
                Cyber Crime Investigation and Legal Issues
            </div>

        </a>

    </nav>

</main>

</body>
</html>
