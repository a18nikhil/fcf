
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fundamentals of Cyber Forensics | FCF</title>

<style>

/* =========================================
   FCF HOMEPAGE
   Burgundy & Copper Gold Theme
   ========================================= */

/* Global Reset */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Georgia, Cambria, "Times New Roman", serif;
    color: #F8F1E8;

    background-color: #21151D;

    background-image:
        linear-gradient(
            rgba(198, 149, 103, 0.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(198, 149, 103, 0.045) 1px,
            transparent 1px
        ),
        radial-gradient(
            ellipse at 25% 20%,
            #482737 0%,
            #2E1B29 45%,
            #21151D 100%
        );

    background-size:
        58px 58px,
        58px 58px,
        cover;

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 35px 20px;
}

/* Main Container */

.container {
    width: 100%;
    max-width: 740px;
    margin: 0 auto;
}

/* Subject Heading */

.header {
    text-align: center;
    margin-bottom: 70px;
}

.header h1 {
    font-size: clamp(36px, 6vw, 55px);
    font-weight: 700;
    line-height: 1.18;
    letter-spacing: -0.5px;

    color: #E8BE91;

    text-shadow:
        0 2px 12px rgba(0, 0, 0, 0.18);
}

/* Gold Divider */

.title-divider {
    width: 110px;
    height: 2px;

    margin: 30px auto 0;

    background: linear-gradient(
        90deg,
        transparent,
        #D9A66D,
        transparent
    );
}

/* Unit Cards Container */

.units {
    display: flex;
    flex-direction: column;
    gap: 22px;
}

/* Unit Cards */

.unit-card {
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    min-height: 170px;

    padding: 38px 25px;

    background: linear-gradient(
        135deg,
        rgba(91, 49, 65, 0.96),
        rgba(53, 29, 43, 0.98)
    );

    border: 1px solid rgba(220, 168, 116, 0.14);
    border-radius: 17px;

    text-align: center;
    text-decoration: none;
    color: inherit;

    overflow: hidden;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.12);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
}

/* Gold Accent Line */

.unit-card::before {
    content: "";

    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;

    width: 5px;

    background: linear-gradient(
        to bottom,
        #E8BE91,
        #B77B4E
    );
}

/* Card Hover */

.unit-card:hover {
    transform: translateY(-3px);

    border-color: rgba(232, 190, 145, 0.45);

    background: linear-gradient(
        135deg,
        #67394E,
        #402536
    );
}

.unit-card:focus-visible {
    outline: 2px solid #E8BE91;
    outline-offset: 4px;
}

/* Unit Number */

.unit-number {
    display: block;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;

    letter-spacing: 2.5px;
    color: #D9A66D;

    margin-bottom: 22px;
}

/* Unit Title */

.unit-title {
    font-size: 25px;
    font-weight: 700;
    line-height: 1.4;

    color: #FFF8F1;

    max-width: 600px;
}

/* Tablet Layout */

@media (max-width: 768px) {

    .header {
        margin-bottom: 60px;
    }

    .header h1 {
        font-size: 46px;
    }

    .unit-card {
        min-height: 165px;
    }

    .unit-title {
        font-size: 23px;
    }
}

/* Mobile Layout */

@media (max-width: 600px) {

    body {
        padding: 30px 18px;
    }

    .header {
        margin-bottom: 55px;
    }

    .header h1 {
        font-size: clamp(35px, 9vw, 46px);
        line-height: 1.2;
    }

    .title-divider {
        width: 95px;
        margin-top: 27px;
    }

    .units {
        gap: 17px;
    }

    .unit-card {
        min-height: 150px;
        padding: 30px 20px;
        border-radius: 14px;
    }

    .unit-number {
        font-size: 12px;
        letter-spacing: 2px;
        margin-bottom: 18px;
    }

    .unit-title {
        font-size: 21px;
        line-height: 1.4;
    }
}

/* Small Phones */

@media (max-width: 380px) {

    body {
        padding: 25px 14px;
    }

    .header h1 {
        font-size: 33px;
    }

    .unit-card {
        min-height: 140px;
        padding: 25px 16px;
    }

    .unit-title {
        font-size: 19px;
    }
}

/* Reduced Motion */

@media (prefers-reduced-motion: reduce) {

    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        transition: none !important;
    }
}

</style>

</head>

<body>

<main class="container">

    <!-- Subject Heading -->

    <header class="header">

        <h1>
            Fundamentals of<br>
            Cyber Forensics
        </h1>

        <div class="title-divider"
             aria-hidden="true"></div>

    </header>

    <!-- Unit Navigation -->

    <nav class="units" aria-label="Course Units">

        <!-- Unit I -->

        <a href="unit1/index.html" class="unit-card">

            <span class="unit-number">
                UNIT I
            </span>

            <div class="unit-title">
                Introduction to Computer Forensics
            </div>

        </a>

        <!-- Unit II -->

        <a href="unit2/index.html" class="unit-card">

            <span class="unit-number">
                UNIT II
            </span>

            <div class="unit-title">
                Computer Forensic Analysis and Information Warfare
            </div>

        </a>

        <!-- Unit III -->

        <a href="unit3/index.html" class="unit-card">

            <span class="unit-number">
                UNIT III
            </span>

            <div class="unit-title">
                Cyber Crime Investigation and Legal Issues
            </div>

        </a>

    </nav>

</main>

</body>
</html>
